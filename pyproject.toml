[project]
name = "rerank-mini"
version = "0.1.0"
description = "Apache-2.0 32M 8K-context cross-encoder reranker distilled from Qwen3-Reranker-8B"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "sentence-transformers>=5.0",
    "transformers>=4.51",
    "huggingface-hub>=0.30",
    "requests>=2.32",
    "pyarrow>=18.0",
    "datasets>=3.4",
    "rank-bm25>=0.2.2",
    "tqdm>=4.67",
]

[project.optional-dependencies]
cpu = ["torch>=2.6"]
cu128 = ["torch>=2.6"]
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.21",
    "onnxscript>=0.2",
]
onnx-gpu = [
    "onnx>=1.17",
    "onnxruntime-gpu>=1.21",
    "onnxscript>=0.2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rerank_mini", "infra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
